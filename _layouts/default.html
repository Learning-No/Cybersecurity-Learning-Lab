<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0d12">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
  <header class="topbar">
    <a class="brand" href="{{ '/' | relative_url }}"><span class="brand-mark">S</span><span>SECURITY<span class="brand-muted"> / LAB</span></span></a>
    <nav><a href="{{ '/' | relative_url }}#roadmap">Roadmap</a><a href="{{ '/' | relative_url }}#notes">Notes</a><a href="{{ '/' | relative_url }}#ethics">Lab rules</a></nav>
    <a class="github-link" href="https://github.com/Learning-No/Cybersecurity-Learning-Lab" target="_blank" rel="noopener">GitHub ↗</a>
  </header>
  <main>{{ content }}</main>
  <footer class="footer"><span>CYBERSECURITY LEARNING LAB</span><span>Learn responsibly. Test only with permission.</span><a href="https://github.com/Learning-No/Cybersecurity-Learning-Lab">Source repository ↗</a></footer>
  <script src="{{ '/assets/js/app.js' | relative_url }}" defer></script>
</body>
</html>
