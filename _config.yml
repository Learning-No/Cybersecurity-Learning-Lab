title: CSLL
description: An independent cybersecurity learning library with safe labs, open-source tools, guided roadmaps, and practical resources.
url: "https://learning-no.github.io"
baseurl: "/Cybersecurity-Learning-Lab"
markdown: kramdown
permalink: pretty
collections:
  notes:
    output: true
    permalink: /notes/:name/
defaults:
  - scope:
      path: ""
      type: notes
    values:
      layout: note
exclude: [README.md, LICENSE]
