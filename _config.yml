title: Cybersecurity Learning Lab
description: A structured, hands-on roadmap for learning cybersecurity ethically.
url: "https://learning-no.github.io"
baseurl: "/Cybersecurity-Learning-Lab"
markdown: kramdown
permalink: pretty
collections:
  notes:
    output: true
    permalink: /notes/:name/
defaults:
  - scope:
      path: ""
      type: notes
    values:
      layout: note
plugins: []
exclude:
  - README.md
  - LICENSE
