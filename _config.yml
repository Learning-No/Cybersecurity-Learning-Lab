title: Cybersecurity Learning Hub
description: A colorful, student-friendly cybersecurity learning hub with safe labs, open-source tools, and guided roadmaps.
url: "https://learning-no.github.io"
baseurl: "/Cybersecurity-Learning-Lab"
markdown: kramdown
permalink: pretty
collections:
  notes:
    output: true
    permalink: /notes/:name/
defaults:
  - scope:
      path: ""
      type: notes
    values:
      layout: note
exclude: [README.md, LICENSE]
